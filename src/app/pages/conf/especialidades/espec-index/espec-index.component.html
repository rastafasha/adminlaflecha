<!-- =======| Main |======= -->
<div class="container animated fadeInUp" id="main" class="main" role="main" name="users">

    <div class="col-xs-12">
        <div class="leftside">
            <!-- Page Title -->
            <app-back-button [title]="title"></app-back-button>
        </div>

        <div class="clear"></div>
        <section class="section dashboard">
             <button class="btn btn-outline-primary btn-sm rounded-circle shadow-sm" (click)="instruccionesModalCat.open()"
                title="Ayuda de la sección">
                <i class="fa fa-question"></i>
            </button>
            <br>
            <!-- Recent Categorias -->
            <div class="container">
                <div class="row">
                    <div class="col-xs-11 col-sm-11">
                        <!-- buscador -->
                        <form class="form-horizontal">
                            <div class="p-1 bg-light rounded rounded-pill shadow-sm mb-4">
                                <div class="input-group">
                                    <input type="search" name="search" type="text" class="form-control col-xs-12"
                                        placeholder="Buscar.." [(ngModel)]="query" aria-describedby="button-addon1"
                                        class="form-control border-0 bg-light">
                                    <div class="input-group-append">
                                        <button id="button-addon1" type="submit" class="btn btn-link text-primary"
                                            (click)="search()" name="submit" data-toggle="tooltip"
                                            title="mostrar todos"><i class="fa fa-search"></i></button>
                                            <a href="javascript:;" (click)="PageSize()" class="btn btn-primary ms-2 "
                                            style="border-radius: 100px;"><i class="fa fa-refresh"></i></a>
                                    </div>
                                </div>
                            </div>
                        </form>
                        <!-- buscador -->
                    </div>
                    <div class="col-xs-1 col-sm-1">
                        <div class="text-right">
                            <button (click)="openEditModal()" class="btn btn-outline-success"
                                            data-toggle="tooltip" data-original-title="Edit"
                                            data-bs-toggle="modal"
                                            data-bs-target="#editCategory">
                                            <i class="fa fa-plus"></i>
                                        </button>
                        </div>
                    </div>
                </div>


                <div class="card recent-sales overflow-auto">

                    <app-loading *ngIf="loading"></app-loading>
                    <div class="card-body" *ngIf="!loading">


                        <table [ngClass]="loading? 'table table-borderless datatable':'table table-borderless'">
                            <thead>
                                <tr>
                                    <th>Nombre</th>
                                    <th>Slug</th>
                                    <th>Creado</th>
                                    <th class="text-nowrap">Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr
                                    *ngFor="let speciality of specialities |  paginate: { itemsPerPage: count, currentPage: p }">

                                    <td>{{speciality.nombre}}</td>
                                    <td>{{speciality.slug}}</td>
                                    <td>{{speciality.createdAt | date:'MMM d, y, h:mm:ss a'}} </td>

                                    <td class="text-nowrap text-center">
                                        <button (click)="onEditProject(speciality)" class="btn btn-outline-success"
                                            data-toggle="tooltip" data-original-title="Edit"
                                            data-bs-toggle="modal"
                                            data-bs-target="#editSpeciality">
                                            <i class="fa fa-edit"></i>
                                        </button>
                                         &nbsp;
                                        <button (click)="eliminarCategory(speciality._id)" class="btn btn-outline-danger" data-toggle="tooltip"
                                            data-original-title="Borrar">
                                            <i class="fa fa-trash"></i>
                                        </button>
                                    </td>


                                </tr>
                            </tbody>

                        </table>
                        <pagination-controls (pageChange)="p = $event"></pagination-controls>

                    </div>

                </div>
            </div>
            <!-- End Recent Categorias -->

        </section>
    </div>

</div>
<!--/main-->
<app-espec-edit (refreshEspecList)="getEspecialidades()" [especSeleccionado]="especSeleccionado" (closeModal)="onClose()" #editEspec></app-espec-edit>
<app-modal-instrucciones [info]="info" sectionId="Especialidades" #instruccionesModalCat></app-modal-instrucciones>
